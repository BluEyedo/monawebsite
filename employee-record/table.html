<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جدول إنجاز الموظفات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body class="">
  <div class="p-3">
    <!-- Top row: buttons + counts -->
    <div class="flex flex-col md:flex-row justify-between gap-4 md:gap-0 mb-4">
      <!-- Buttons -->
      <div class="flex flex-wrap gap-3 md:gap-6 flex-1">
        <button type="button"
          class="h-12 bg-gradient-to-br bg-blue-500 text-white rounded-lg px-3 shadow-sm font-bold transition cursor-pointer duration-300 hover:bg-blue-400 hover:shadow-lg flex items-center gap-2">
          طباعة الجدول
          <i class="bi bi-printer"></i>
        </button>

        <button type="button"
          class="h-12 bg-gradient-to-br bg-cyan-500 text-white rounded-lg px-3 shadow-sm font-bold transition cursor-pointer duration-300 hover:bg-cyan-400 hover:shadow-lg flex items-center gap-2">
          تصدير الجدول إلى EXCEL
          <i class="bi bi-file-earmark-spreadsheet"></i>
        </button>

        <button type="button"
          class="h-12 bg-gradient-to-br bg-red-500 text-white rounded-lg px-3 shadow-sm font-bold transition cursor-pointer duration-300 hover:bg-red-400 hover:shadow-lg flex items-center gap-2">
          حذف كامل البيانات
          <i class="bi bi-trash3"></i>
        </button>
      </div>

      <!-- Counts -->
      <!-- <div class="w-full md:w-60 border border-gray-200 shadow-lg p-3 rounded-xl mt-3 md:mt-0">
        <div id="doneCount">🟢 تم إنجازه: 0</div>
        <div id="notDoneCount">🔴 لم يتم إنجازه: 0</div>
      </div> -->
    </div>

    <!-- Table -->
    <div class="overflow-x-auto rounded shadow">
      <table id="employeeTable" class="min-w-full border border-gray-300 text-right">
        <thead class="bg-gray-100">
          <tr>
            <th class="border px-4 py-2">م</th>
            <th class="border px-4 py-2">التاريخ</th>
            <th class="border px-4 py-2">اسم المدرسة</th>
            <th class="border px-4 py-2">المجال الاشرافي</th>
            <th class="border px-4 py-2">أسلوب التنفيذ</th>
            <th class="border px-4 py-2">نوعه</th>
            <th class="border px-4 py-2">صور الباركود</th>
            <th class="border px-4 py-2">الإجراء</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- البيانات سيتم إضافتها هنا -->
        </tbody>
      </table>
    </div>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

      <div class="relative">
        <button id="closeModal" class="absolute -top-4 -right-4 bg-white rounded-full px-2 py-1 shadow text-black">
          ✕
        </button>

        <img id="modalImage" class="max-w-[90vw] max-h-[90vh] rounded-xl shadow-lg" />
      </div>
    </div>



  </div>
  <script src="../utils/findDay.js"></script>
  <script src="../utils/findSelectedValues.js"></script>
  <script src="buttonsFunctions.js"></script>
  <script>
    function updateCounts() {
      const data = JSON.parse(localStorage.getItem("employeeData") || "[]");

      // حساب المهام المكتملة وغير المكتملة
      // const done = data.filter((item) => item.category == "1").length;
      // const notDone = data.filter((item) => item.category == "2").length;

      // // عرض الأرقام
      // document.getElementById(
      //   "doneCount"
      // )?.textContent = `🟢 تم إنجازه: ${done ?? 0}`;
      // document.getElementById(
      //   "notDoneCount"
      // )?.textContent = `🔴  لم يتم إنجازه: ${notDone ?? 0}`;
    }

    // استدعاء الدالة بعد تحميل الجدول
    // window.addEventListener("DOMContentLoaded", updateCounts);

    function loadTable() {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = ""; // مسح أي محتوى قديم

      const data = JSON.parse(localStorage.getItem("employeeData") || "[]");

      console.log(data)

      data.forEach((item, index) => {
        const headerRow = document.createElement("tr");
        const row = document.createElement("tr");
        const nestedRowHeader = document.createElement("tr");
        const nestedRow = document.createElement("tr");


        headerRow.className = "hover:bg-gray-50";

        headerRow.innerHTML = `<td class="font-bold text-center bg-[#F3F4F6]">م</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">التاريخ</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">اسم المدرسة</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">المجال الاشرافي</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">أسلوب التنفيذ</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">نوعه</td>
            <td  class="border px-4 py-2 font-bold bg-[#F3F4F6]">صور الباركود</td>
            <td class="border px-4 py-2 font-bold bg-[#F3F4F6]">الإجراء</td>
            `;

        row.className = "hover:bg-gray-50";



        row.innerHTML = `
        
                <td class="border px-4 py-2 text-xs">${index + 1}</td>
                <td class="border px-4 py-2 text-xs">${daysDayByIndex(item.day)} ${item.date}</td>
                <td class="border px-4 py-2 text-xs">${item.name}</td>
                <td class="border px-4 py-2 text-xs">${findSelectedScope(item.job)}</td>
                <td class="border px-4 py-2 text-xs">${item.details}</td>
                <td class="border px-4 py-2 text-xs">${findSelectedType(item.category)}</td>
                <td class="border px-4 py-2 text-center">
                <div class="flex flex-wrap justify-center gap-2">
                  ${typeof item.barcodeImage == "string" ? `<img 
                        src="${item.barcodeImage}" 
                        alt="barcode"
                        data-index="${index}"
                        data-img="${item.barcodeImage}"
                        class="barcode-thumb w-14 h-14 object-cover rounded-lg cursor-pointer
                              border hover:scale-105 transition"
                      />` : item.barcodeImage
            .map(
              (imgSrc, imgIndex) => `
                      <img 
                        src="${imgSrc}" 
                        alt="barcode"
                        data-index="${index}"
                        data-img="${imgSrc}"
                        class="barcode-thumb w-14 h-14 object-cover rounded-lg cursor-pointer
                              border hover:scale-105 transition"
                      />
                    `
            )
            .join("")}
                </div>
              </td>
                <td class="border px-4 py-2 text-center">
                    <button class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded delete-btn">
                        حذف
                        <i class="bi bi-trash3"></i>
                    </button>
                </td>
        
            `;


        nestedRowHeader.className = "hover:bg-gray-50";
        nestedRowHeader.innerHTML = `<td class="border px-4 py-2 text-center bg-[#F3F4F6] font-bold" colspan="3">
          الأهداف التفصيلية للأسلوب الإشرافي
            </td>
            <td class="border px-4 py-2 text-center bg-[#F3F4F6] font-bold" colspan="3">
              المؤشرات الدالة على تحقق المستهدفات (مخرجات قابلة للقياس )
            </td>
            <td class="border px-4 py-2 text-center bg-[#F3F4F6] font-bold" colspan="3">
          توصيات عامة لتحسين الممارسات أو استدامة الأثر
            </td>
            `

        nestedRow.className = "hover:bg-gray-50";

        nestedRow.innerHTML = `<td class="border px-4 py-2 text-center " colspan="3">
            ${item.objectives ?? "-"}
            </td>
            <td class="border px-4 py-2 text-center " colspan="3">
            ${item.indicators ?? "-"}
            </td>
            <td class="border px-4 py-2 text-center " colspan="3">
            ${item.suggestions ?? "-"}
            </td>
            `

        // إضافة حدث زر الحذف
        row.querySelector(".delete-btn").addEventListener("click", () => {
          if (confirm("هل أنت متأكد من حذف جميع البيانات؟")) {
            data.splice(index, 1); // حذف من المصفوفة
            localStorage.setItem("employeeData", JSON.stringify(data)); // تحديث localStorage
            loadTable(); // إعادة تحميل الجدول
            updateCounts();
          }
        });

        if (index > 0) {
          tableBody.appendChild(headerRow);
        }
        tableBody.appendChild(row);
        tableBody.appendChild(nestedRowHeader)
        tableBody.appendChild(nestedRow)
      });
    }

    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const closeModal = document.getElementById("closeModal");

    // فتح الصورة
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("barcode-thumb")) {
        modalImg.src = e.target.dataset.img;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }
    });

    // إغلاق
    closeModal.addEventListener("click", () => {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    });

    // إغلاق عند الضغط خارج الصورة
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    });

    // تحميل الجدول عند فتح الصفحة
    window.addEventListener("DOMContentLoaded", loadTable);
  </script>
</body>

</html>
